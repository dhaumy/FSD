<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>Student Registration Form</h1>
    <form action="/signup" method="post">
    <label for="full-name">Full Name:</label>
    <input type="text" name="user-full-name" id="full-name" placeholder="Enter your full name" maxlength="25" minlength="3" required>
    <br>
    <label for="email">Email Address:</label>
    <input type="email" id="email" name="user-email" placeholder="Enter your email" required>
    <br>
    <label for="password">Password:</label>
    <input type="password" id="password" name="user-password" placeholder="Enter your password" required>
    <br>
    <label for="city" >City (Optional):</label>
    <input type="text" id="city" placeholder="Enter your city" name="user-city">
    <br>
    <label for="user-gender">Gender:</label>
    <input type="radio" value="user-male" id="user-male" name="user-gender">
    <label for="user-male">Male</label>
    <input type="radio" id="user-female" value="user-female" name="user-gender" checked>
    <label for="user-female">Female</label>
    <br>
    <label for="roll-number">Roll Number:</label>
    <input type="text" id="roll-number" name="user-roll-number" placeholder="Enter your roll-number" value="2616400" required>
    <br>
    <label for="country" >Country:</label>
    <select id="country" name="user-country">
        <option value="England">England</option>
        <option value="Australia">Australia</option>
        <option value="India" selected >India</option>
        <option value="USA">USA</option>
        <option value="Other">Other</option>
    </select>
    <br><br>
    <label>Interested in:</label><br>

    <input type="checkbox" id="dsa" value="dsa" name="user-interests">
    <label for="dsa">DSA</label>
    <input type="checkbox" id="development" value="development" name="user-interests">
    <label for="development">Development</label>
    <input type="checkbox" id="ai" value="ai" name="user-interests">
    <label for="ai">AI</label>
    <input type="checkbox" id="data-science" value="data-science" name="user-interests">
    <label for="data-science">Data Science</label>
    <input type="checkbox" id="marketing" value="marketing" name="user-interests">
    <label for="marketing">Marketing</label>
    <input type="checkbox" id="product-design" value="product-design" name="user-interests">
    <label for="product-design">Product Design</label>
    <button type="submit">Submit</button>
    <button type="reset">Reset</button>

    
    
    </form>


</body>
</html>
